# main への push で月次レポートを GitHub Pages に自動公開する
# report が HTML を出力しない間は安全にスキップする
name: レポートのデプロイ
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      has-report: ${{ steps.check.outputs.has-report }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: report コマンドの有無を確認
        id: check
        working-directory: app
        run: |
          if npm run --silent kakeibo -- report 2026-07 2>/dev/null | grep -qi '<html'; then
            echo "has-report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-report=false" >> "$GITHUB_OUTPUT"
            echo "report コマンド未実装のためデプロイをスキップします"
          fi
      - name: レポート生成
        if: steps.check.outputs.has-report == 'true'
        working-directory: app
        run: |
          mkdir -p ../public
          npm run --silent kakeibo -- report 2026-07 > ../public/index.html
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.has-report == 'true'
        with:
          path: public
  deploy:
    needs: build
    if: needs.build.outputs.has-report == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
